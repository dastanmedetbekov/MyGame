name: Build Game

on:
  push:
    branches: [ "main", "feature/**", "copilot/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libsfml-dev \
          libx11-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libudev-dev \
          libgl1-mesa-dev \
          libflac-dev \
          libogg-dev \
          libvorbis-dev \
          libopenal-dev

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . --config Release -j$(nproc)

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts/linux
        cp build/bin/MyGame artifacts/linux/
        cp -r assets artifacts/linux/ || echo "No assets directory found"
        # Create a simple run script
        echo '#!/bin/bash' > artifacts/linux/run.sh
        echo 'cd "$(dirname "$0")"' >> artifacts/linux/run.sh
        echo './MyGame' >> artifacts/linux/run.sh
        chmod +x artifacts/linux/run.sh

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyGame-Linux
        path: artifacts/linux/
        retention-days: 30

  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Install SFML
      run: |
        # Download and extract SFML
        $SFML_VERSION = "2.6.1"
        $SFML_URL = "https://github.com/SFML/SFML/releases/download/$SFML_VERSION/SFML-$SFML_VERSION-windows-vc15-64-bit.zip"
        Invoke-WebRequest -Uri $SFML_URL -OutFile sfml.zip
        Expand-Archive -Path sfml.zip -DestinationPath C:\SFML

        # Set SFML_DIR for CMake
        echo "SFML_DIR=C:\SFML\SFML-$SFML_VERSION" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DSFML_DIR="${env:SFML_DIR}/lib/cmake/SFML" `
          -DCMAKE_BUILD_TYPE=Release
      shell: pwsh

    - name: Build
      run: |
        cd build
        cmake --build . --config Release
      shell: pwsh

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts/windows

        # Copy executable
        Copy-Item -Path "build/bin/Release/MyGame.exe" -Destination "artifacts/windows/" -ErrorAction SilentlyContinue
        if (-not $?) {
          Copy-Item -Path "build/bin/MyGame.exe" -Destination "artifacts/windows/" -ErrorAction SilentlyContinue
        }

        # Copy SFML DLLs
        $SFML_BIN = "$env:SFML_DIR\bin"
        Copy-Item -Path "$SFML_BIN\sfml-system-2.dll" -Destination "artifacts/windows/" -ErrorAction SilentlyContinue
        Copy-Item -Path "$SFML_BIN\sfml-window-2.dll" -Destination "artifacts/windows/" -ErrorAction SilentlyContinue
        Copy-Item -Path "$SFML_BIN\sfml-graphics-2.dll" -Destination "artifacts/windows/" -ErrorAction SilentlyContinue
        Copy-Item -Path "$SFML_BIN\sfml-audio-2.dll" -Destination "artifacts/windows/" -ErrorAction SilentlyContinue

        # Copy assets
        if (Test-Path "assets") {
          Copy-Item -Path "assets" -Destination "artifacts/windows/" -Recurse -ErrorAction SilentlyContinue
        }

        # Create a simple run script
        echo "@echo off" > artifacts/windows/run.bat
        echo "cd /d `"%~dp0`"" >> artifacts/windows/run.bat
        echo "MyGame.exe" >> artifacts/windows/run.bat
        echo "pause" >> artifacts/windows/run.bat
      shell: pwsh

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyGame-Windows
        path: artifacts/windows/
        retention-days: 30

  create-release-info:
    name: Create release summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: always()

    steps:
    - name: Generate summary
      run: |
        echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- **Linux Build**: Available as 'MyGame-Linux' artifact" >> $GITHUB_STEP_SUMMARY
        echo "- **Windows Build**: Available as 'MyGame-Windows' artifact" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Status" >> $GITHUB_STEP_SUMMARY
        echo "- Linux: ${{ needs.build-linux.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Windows: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
